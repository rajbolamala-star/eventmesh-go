apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventmesh-api
  labels:
    app: eventmesh-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eventmesh-api
  template:
    metadata:
      labels:
        app: eventmesh-api
    spec:
      containers:
        - name: api
          image: eventmesh-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: eventmesh-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080

