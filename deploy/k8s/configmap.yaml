apiVersion: v1
kind: ConfigMap
metadata:
  name: eventmesh-config
data:
  APP_ENV: production
  HTTP_ADDR: :8080
  WORKER_METRICS_ADDR: :9091
  LOG_LEVEL: info
  SHUTDOWN_TIMEOUT: 10s
  OTEL_TRACES_ENABLED: "false"
  OTEL_SERVICE_NAME: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  OTEL_TRACE_SAMPLE_RATIO: "0.1"
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: eventmesh.events
  KAFKA_RETRY_TOPICS: eventmesh.retry.1,eventmesh.retry.2,eventmesh.retry.3
  KAFKA_DLQ_TOPIC: eventmesh.dlq
  KAFKA_RETRY_DELAYS: 5s,30s,5m
  KAFKA_CONSUMER_GROUP: eventmesh-processors
  KAFKA_PRODUCER_TIMEOUT: 5s
  KAFKA_CONSUMER_MIN_BYTES: "1"
  KAFKA_CONSUMER_MAX_BYTES: "10000000"
  KAFKA_CONSUMER_MAX_WAIT: 1s
  KAFKA_PROCESSING_CONCURRENCY: "1"
  POSTGRES_URL: postgres://eventmesh:eventmesh@postgres:5432/eventmesh?sslmode=disable
  POSTGRES_MAX_CONNS: "10"
  POSTGRES_MIN_CONNS: "1"
  POSTGRES_CONNECT_TIMEOUT: 5s
  REDIS_ADDR: redis:6379
  REDIS_DB: "0"
  REDIS_CONNECT_TIMEOUT: 5s
  REDIS_OPERATION_TIMEOUT: 2s
  IDEMPOTENCY_PROCESSING_TTL: 5m
  IDEMPOTENCY_COMPLETED_TTL: 24h
